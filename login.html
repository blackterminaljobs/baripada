<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>BlackTerminal Staff Login</title>

  <style>
    :root{
      --navy:#071426;
      --blue:#086ee1;
      --blue2:#2f6fe4;
      --bg:#f5f8fc;
      --text:#172236;
      --muted:#748198;
      --line:#dfe6f0;
      --white:#ffffff;
      --green:#3b8c5a;
      --red:#d63d3d;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(47,111,228,.10),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f6f9fd 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color:var(--text);
    }

    .page{
      width:100%;
      max-width:760px;
      min-height:100vh;
      margin:auto;

      padding:
        max(32px, env(safe-area-inset-top))
        34px
        max(35px, env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;
    }

    /* =========================
       TOP
    ========================= */

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin-top:15px;
      margin-bottom:62px;

      gap:15px;
    }

    .portal-name{
      font-size:20px;
      font-weight:700;
      color:#718098;
      letter-spacing:.2px;
    }

    .secure{
      display:flex;
      align-items:center;
      gap:9px;

      background:#edf8f1;
      color:var(--green);

      padding:13px 19px;
      border-radius:30px;

      font-size:17px;
      font-weight:700;

      white-space:nowrap;
    }

    .secure-dot{
      width:14px;
      height:14px;
      border-radius:50%;
      background:#3b8c5a;
    }

    /* =========================
       HERO
    ========================= */

    .hero{
      margin-bottom:38px;
    }

    .hero h1{
      font-size:53px;
      line-height:1.08;
      letter-spacing:-2px;

      margin-bottom:18px;

      color:#162136;
    }

    .hero p{
      font-size:23px;
      line-height:1.55;

      color:#77849a;
      max-width:680px;
    }

    /* =========================
       FORM
    ========================= */

    .form-section{
      width:100%;
    }

    .field{
      margin-bottom:27px;
    }

    label{
      display:block;

      font-size:21px;
      font-weight:750;

      margin-bottom:13px;

      color:#172236;
    }

    input,
    select{
      width:100%;
      height:92px;

      border:2px solid var(--line);
      border-radius:25px;

      background:#fff;
      color:#182338;

      font-size:23px;

      padding:0 28px;

      outline:none;

      transition:.2s ease;
    }

    input::placeholder{
      color:#a2adbd;
    }

    input:focus,
    select:focus{
      border-color:#4b8ff0;

      box-shadow:
        0 0 0 5px rgba(47,111,228,.10);
    }

    /* =========================
       MOBILE NUMBER
    ========================= */

    .mobile-wrap{
      position:relative;
    }

    .mobile-prefix{
      position:absolute;

      left:26px;
      top:50%;

      transform:translateY(-50%);

      font-size:22px;
      font-weight:700;

      color:#4d5c72;

      z-index:2;

      pointer-events:none;
    }

    #mobile{
      padding-left:78px;
    }

    /* =========================
       REMEMBER
    ========================= */

    .remember-row{
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin:3px 0 29px;

      gap:15px;
    }

    .remember{
      display:flex;
      align-items:center;

      gap:14px;

      font-size:19px;
      font-weight:700;

      color:#748096;

      cursor:pointer;
    }

    .remember input{
      width:31px;
      height:31px;

      margin:0;
      padding:0;

      accent-color:var(--blue);
    }

    .help-link{
      font-size:18px;
      font-weight:750;

      color:#3474da;

      cursor:pointer;

      border:0;
      background:none;
    }

    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-btn{
      width:100%;
      height:108px;

      border:0;
      border-radius:27px;

      background:
        linear-gradient(
          135deg,
          #3478e8,
          #245bd1
        );

      color:#fff;

      font-size:29px;
      font-weight:800;

      cursor:pointer;

      box-shadow:
        0 18px 35px rgba(47,111,228,.24);

      transition:.2s ease;
    }

    .login-btn:hover{
      transform:translateY(-1px);

      box-shadow:
        0 21px 40px rgba(47,111,228,.30);
    }

    .login-btn:active{
      transform:scale(.99);
    }

    .login-btn.loading{
      opacity:.75;
      pointer-events:none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message{
      display:none;

      margin-top:24px;

      padding:21px 25px;

      border-radius:20px;

      font-size:18px;
      line-height:1.5;

      font-weight:600;
    }

    .message.error{
      display:block;

      color:#c93434;

      background:#fff1f1;

      border:2px solid #ffd0d0;
    }

    .message.success{
      display:block;

      color:#287c4b;

      background:#effaf3;

      border:2px solid #cdebd8;
    }

    /* =========================
       HELP
    ========================= */

    .help{
      margin-top:58px;
    }

    .divider{
      display:flex;
      align-items:center;

      gap:22px;

      color:#a4afbf;

      font-size:19px;

      margin-bottom:30px;
    }

    .divider::before,
    .divider::after{
      content:"";

      height:2px;

      background:#e2e7ee;

      flex:1;
    }

    .help-btn{
      width:100%;
      height:80px;

      border-radius:22px;

      background:#fff;

      border:2px solid var(--line);

      color:#5c687d;

      font-size:20px;
      font-weight:750;

      margin-bottom:17px;

      cursor:pointer;
    }

    .help-btn:active{
      background:#f6f8fb;
    }

    /* =========================
       FOOTER
    ========================= */

    footer{
      text-align:center;

      color:#a4afbf;

      font-size:17px;

      letter-spacing:.3px;

      margin-top:auto;

      padding-top:45px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      background:rgba(7,20,38,.45);

      backdrop-filter:blur(5px);

      display:none;

      align-items:center;
      justify-content:center;

      padding:25px;

      z-index:1000;
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:100%;
      max-width:500px;

      background:#fff;

      border-radius:25px;

      padding:30px;

      box-shadow:
        0 25px 80px rgba(0,0,0,.18);
    }

    .modal-box h2{
      font-size:28px;

      margin-bottom:12px;
    }

    .modal-box p{
      color:#718096;

      font-size:17px;

      line-height:1.6;

      margin-bottom:24px;
    }

    .close-btn{
      width:100%;
      height:55px;

      border:0;

      border-radius:15px;

      background:#edf3fb;

      color:#31577f;

      font-size:17px;

      font-weight:700;

      cursor:pointer;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:600px){

      .page{
        padding-left:34px;
        padding-right:34px;
      }

      .top{
        margin-bottom:60px;
      }

      .portal-name{
        font-size:17px;
      }

      .secure{
        font-size:15px;
        padding:11px 15px;
      }

      .secure-dot{
        width:11px;
        height:11px;
      }

      .hero h1{
        font-size:48px;
      }

      .hero p{
        font-size:21px;
      }

      label{
        font-size:20px;
      }

      input,
      select{
        height:88px;
        font-size:21px;
        border-radius:23px;
      }

      .login-btn{
        height:105px;
        font-size:28px;
      }
    }

    @media(max-width:430px){

      .page{
        padding-left:25px;
        padding-right:25px;
      }

      .top{
        margin-bottom:50px;
      }

      .portal-name{
        font-size:16px;
      }

      .secure{
        padding:10px 13px;
        font-size:14px;
      }

      .hero h1{
        font-size:43px;
      }

      .hero p{
        font-size:19px;
      }

      input,
      select{
        height:82px;
        font-size:19px;
      }

      .login-btn{
        height:95px;
        font-size:25px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- =========================
       TOP
  ========================== -->

  <div class="top">

    <div class="portal-name">
      Staff Management Portal
    </div>

    <div class="secure">
      <span class="secure-dot"></span>
      Secure Login
    </div>

  </div>


  <!-- =========================
       HERO
  ========================== -->

  <div class="hero">

    <h1>
      Welcome back
    </h1>

    <p>
      Enter your name and mobile number
      to access the BlackTerminal staff portal.
    </p>

  </div>


  <!-- =========================
       LOGIN FORM
  ========================== -->

  <div class="form-section">


    <!-- LOGIN TYPE -->

    <div class="field">

      <label for="role">
        Login as
      </label>

      <select id="role">

        <option value="telecaller">
          Telecaller
        </option>

        <option value="coordinator">
          Student Coordinator
        </option>

      </select>

    </div>


    <!-- NAME -->

    <div class="field">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        autocomplete="name"
      >

    </div>


    <!-- MOBILE -->

    <div class="field">

      <label for="mobile">
        Mobile Number
      </label>

      <div class="mobile-wrap">

        <span class="mobile-prefix">
          +91
        </span>

        <input
          type="tel"
          id="mobile"
          placeholder="Enter 10-digit mobile number"
          inputmode="numeric"
          maxlength="10"
          autocomplete="tel"
        >

      </div>

    </div>


    <!-- REMEMBER -->

    <div class="remember-row">

      <label class="remember">

        <input
          type="checkbox"
          id="remember"
          checked
        >

        <span>
          Remember me
        </span>

      </label>

      <button
        type="button"
        class="help-link"
        onclick="showHelp()"
      >
        Need help?
      </button>

    </div>


    <!-- LOGIN BUTTON -->

    <button
      type="button"
      class="login-btn"
      id="loginBtn"
      onclick="loginUser()"
    >
      Sign In →
    </button>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- =========================
       HELP
  ========================== -->

  <div class="help">

    <div class="divider">
      Need help?
    </div>

    <button
      class="help-btn"
      onclick="contactAdmin()"
    >
      Contact Admin
    </button>

    <button
      class="help-btn"
      onclick="showSecurity()"
    >
      Login Information
    </button>

  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    © 2026 BlackTerminal Computer Institute, Baripada
  </footer>

</div>


<!-- =========================
     MODAL
========================== -->

<div
  class="modal"
  id="modal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      Information
    </h2>

    <p id="modalText">
      Information
    </p>

    <button
      class="close-btn"
      onclick="closeModal()"
    >
      Close
    </button>

  </div>

</div>


<script>

  /*
  ============================================================
  BLACKTERMINAL STAFF LOGIN
  ============================================================

  Login Types:

  1. Telecaller
     → telecaller.html

  2. Student Coordinator
     → coordinator.html

  Firebase Authentication:
  NOT USED

  Login:
  Name + Mobile Number

  ============================================================
  */


  const nameInput =
    document.getElementById("name");

  const mobileInput =
    document.getElementById("mobile");

  const roleInput =
    document.getElementById("role");

  const rememberInput =
    document.getElementById("remember");

  const loginBtn =
    document.getElementById("loginBtn");

  const messageBox =
    document.getElementById("message");


  /* ============================================================
     MOBILE INPUT
  ============================================================ */

  mobileInput.addEventListener(
    "input",
    function(){

      this.value =
        this.value
          .replace(/\D/g,"")
          .slice(0,10);

    }
  );


  /* ============================================================
     NAME INPUT
  ============================================================ */

  nameInput.addEventListener(
    "input",
    function(){

      this.value =
        this.value
          .replace(/\s+/g," ")
          .slice(0,60);

    }
  );


  /* ============================================================
     LOAD REMEMBERED LOGIN
  ============================================================ */

  window.addEventListener(
    "DOMContentLoaded",
    function(){

      try{

        const saved =
          JSON.parse(
            localStorage.getItem(
              "bt_staff_login"
            )
          );

        if(saved){

          nameInput.value =
            saved.name || "";

          mobileInput.value =
            saved.mobile || "";

          roleInput.value =
            saved.role || "telecaller";

          rememberInput.checked =
            true;

        }

      }
      catch(error){

        console.log(
          "No saved login found."
        );

      }

    }
  );


  /* ============================================================
     LOGIN
  ============================================================ */

  function loginUser(){

    clearMessage();


    const name =
      nameInput.value.trim();


    const mobile =
      mobileInput.value.trim();


    const role =
      roleInput.value;


    /* NAME */

    if(name.length < 2){

      showMessage(
        "Please enter your full name.",
        "error"
      );

      nameInput.focus();

      return;

    }


    /* MOBILE */

    if(!/^[6-9][0-9]{9}$/.test(mobile)){

      showMessage(
        "Please enter a valid 10-digit mobile number.",
        "error"
      );

      mobileInput.focus();

      return;

    }


    /* LOADING */

    loginBtn.classList.add(
      "loading"
    );

    loginBtn.innerHTML =
      "Signing in...";


    setTimeout(
      function(){

        /*
        ========================================
        SAVE SESSION
        ========================================
        */

        const loginTime =
          new Date().toISOString();


        sessionStorage.setItem(
          "bt_logged_in",
          "true"
        );


        sessionStorage.setItem(
          "bt_user_name",
          name
        );


        sessionStorage.setItem(
          "bt_user_mobile",
          mobile
        );


        sessionStorage.setItem(
          "bt_user_role",
          role
        );


        sessionStorage.setItem(
          "bt_login_time",
          loginTime
        );


        /*
        ========================================
        REMEMBER LOGIN
        ========================================
        */

        if(rememberInput.checked){

          localStorage.setItem(
            "bt_staff_login",

            JSON.stringify({

              name:name,

              mobile:mobile,

              role:role

            })

          );

        }
        else{

          localStorage.removeItem(
            "bt_staff_login"
          );

        }


        /*
        ========================================
        SUCCESS
        ========================================
        */

        showMessage(
          "Login successful. Opening your portal...",
          "success"
        );


        /*
        ========================================
        REDIRECT
        ========================================
        */

        setTimeout(
          function(){

            if(role === "telecaller"){

              window.location.href =
                "telecaller.html";

            }

            else if(role === "coordinator"){

              window.location.href =
                "coordinator.html";

            }

          },
          700
        );


      },
      500
    );

  }


  /* ============================================================
     MESSAGE
  ============================================================ */

  function showMessage(
    text,
    type
  ){

    messageBox.textContent =
      text;

    messageBox.className =
      "message " + type;

  }


  function clearMessage(){

    messageBox.textContent =
      "";

    messageBox.className =
      "message";

  }


  /* ============================================================
     CONTACT ADMIN
  ============================================================ */

  function contactAdmin(){

    /*
      CHANGE THIS NUMBER TO YOUR
      ACTUAL BLACKTERMINAL ADMIN
      WHATSAPP NUMBER.
    */

    const adminNumber =
      "919999999999";


    const text =
      "Hello BlackTerminal Admin, I need help with staff portal login.";


    window.open(

      "https://wa.me/" +
      adminNumber +
      "?text=" +
      encodeURIComponent(text),

      "_blank"

    );

  }


  /* ============================================================
     HELP
  ============================================================ */

  function showHelp(){

    showModal(

      "Need Help?",

      "Select your role, enter your registered name and 10-digit mobile number, then press Sign In. Telecaller will open the Telecaller Portal and Student Coordinator will open the Coordinator Portal."

    );

  }


  /* ============================================================
     LOGIN INFORMATION
  ============================================================ */

  function showSecurity(){

    showModal(

      "Login Information",

      "This portal uses a simple Name + Mobile Number login. Firebase Authentication is not required for this login page. Your selected role is stored in the current browser session."

    );

  }


  /* ============================================================
     MODAL
  ============================================================ */

  function showModal(
    title,
    text
  ){

    document.getElementById(
      "modalTitle"
    ).textContent = title;


    document.getElementById(
      "modalText"
    ).textContent = text;


    document.getElementById(
      "modal"
    ).classList.add("show");

  }


  function closeModal(){

    document.getElementById(
      "modal"
    ).classList.remove("show");

  }


  function closeModalOutside(
    event
  ){

    if(
      event.target.id === "modal"
    ){

      closeModal();

    }

  }


  /* ============================================================
     ENTER KEY
  ============================================================ */

  document.addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        loginUser();

      }


      if(event.key === "Escape"){

        closeModal();

      }

    }
  );

</script>

</body>
</html>
